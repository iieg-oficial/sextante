name: sextante

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 3

x-host-gateway: &host-gateway
  - "host.docker.internal:host-gateway"

services:
  sextante:
    image: ghcr.io/ghegar/sacbe:3.0.1-4
    container_name: sextante
    restart: unless-stopped
    ports:
      - "${GEOSERVER_BIND_ADDR:?}:${GEOSERVER_PORT:?}:8080"
    env_file:
      - .env
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:?}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:?}
      GEOSERVER_CONTEXT: ${GEOSERVER_CONTEXT_ROOT:?}
      GEOSERVER_DATA_DIR: ${GEOSERVER_DATA_DIR:?}
      GEOWEBCACHE_CACHE_DIR: ${GEOWEBCACHE_CACHE_DIR:?}
      ENABLE_JSONP: ${ENABLE_JSONP:?}
      MAX_FILTER_RULES: ${MAX_FILTER_RULES:?}
      OPTIMIZE_LINE_WIDTH: ${OPTIMIZE_LINE_WIDTH:?}
      GEOSERVER_PROXY_BASE_URL: ${GEOSERVER_PROXY_BASE_URL:?}
      GEOSERVER_CSRF_WHITELIST: ${GEOSERVER_CSRF_WHITELIST:?}
      PROXY_SCHEME: ${HTTP_SCHEME:?}
      PROXY_SECURE: ${TOMCAT_SECURE:?}
      PROXY_HOST: ${PROXY_HOST:?}
      PROXY_PORT: ${PROXY_PORT:?}
      JAVA_MIN_MEM: ${INITIAL_MEMORY:?}
      JAVA_MAX_MEM: ${MAXIMUM_MEMORY:?}
      JAVA_EXTRA_OPTS: ${ADDITIONAL_JAVA_STARTUP_OPTIONS?}
      GEOSERVER_XSTREAM_WHITELIST: ${GEOSERVER_XSTREAM_WHITELIST?}
      POSTGIS_HOST: ${POSTGIS_HOST:?}
      POSTGIS_PORT: ${POSTGIS_PORT:?}
      POSTGIS_DB: ${POSTGIS_DB:?}
      GS_CONTROLFLOW_TIMEOUT: ${GS_CONTROLFLOW_TIMEOUT:?}
      GS_CONTROLFLOW_OWS_GLOBAL: ${GS_CONTROLFLOW_OWS_GLOBAL:?}
      GS_CONTROLFLOW_OWS_WMS_GETMAP: ${GS_CONTROLFLOW_OWS_WMS_GETMAP:?}
      GS_CONTROLFLOW_OWS_WFS_MSEXCEL: ${GS_CONTROLFLOW_OWS_WFS_MSEXCEL:?}
      GS_CONTROLFLOW_OWS_GWC: ${GS_CONTROLFLOW_OWS_GWC:?}
    volumes:
      - ./geoserver_data:/opt/geoserver/data_dir
      - ${GWC_CACHE_HOST_DIR:?}:${GEOWEBCACHE_CACHE_DIR:?}
      - ./config/overlay:/etc/geoserver/overlay:ro
      - ./fonts:/etc/geoserver/fonts:ro
      - ./config/classes:/etc/geoserver/classes:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fsI http://localhost:8080/${GEOSERVER_CONTEXT_ROOT:?}/web/ >/dev/null || exit 1"]
      timeout: 10s
      start_period: 180s
    extra_hosts: *host-gateway
    networks:
      - sextante-net
      - iieg-network
    logging: *logging

  docker-socket-proxy:
    image: nginx:1.30.4-alpine
    container_name: sextante-docker-socket-proxy
    restart: unless-stopped
    user: "101:101"
    group_add:
      - ${DOCKER_GID:?}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./version-api/docker-proxy.conf:/etc/nginx/nginx.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    logging: *logging

  version-api:
    build: ./version-api
    container_name: sextante-version-api
    restart: unless-stopped
    ports:
      - "${VERSION_API_BIND_ADDR:?}:${VERSION_API_PORT:?}:8088"
    environment:
      ONTOY_SERVICE: sextante
      ONTOY_NODE: ${ONTOY_NODE:?}
      ONTOY_NODE_REPORTER: ${ONTOY_NODE_REPORTER:?}
      ONTOY_PEER_CHECKS: ${ONTOY_PEER_CHECKS}
      ONTOY_COMPOSE_PROJECT: sextante
      ONTOY_DISK_PATH: ${ONTOY_DISK_PATH:?}
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    volumes:
      - ./VERSION:/app/VERSION:ro
      - /etc/os-release:/host/etc/os-release:ro
    depends_on:
      - docker-socket-proxy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/ontoy').read()"]
    networks:
      - iieg-network
      - docker-api
    logging: *logging

networks:
  sextante-net:
    driver: bridge
  iieg-network:
    external: true
  docker-api:
    name: sextante-docker-api
    internal: true
