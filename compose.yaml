name: sextante

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 3

x-host-gateway: &host-gateway
  - "host.docker.internal:host-gateway"

services:
  sextante:
    image: kartoza/geoserver:3.0.0
    container_name: sextante
    restart: unless-stopped
    ports:
      - "${GEOSERVER_BIND_ADDR:?}:${GEOSERVER_PORT:?}:8080"
    env_file:
      - .env
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:?}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:?}
      RESET_ADMIN_CREDENTIALS: ${RESET_ADMIN_CREDENTIALS:?}
      GEOSERVER_CONTEXT_ROOT: ${GEOSERVER_CONTEXT_ROOT:?}
      GEOSERVER_DATA_DIR: ${GEOSERVER_DATA_DIR:?}
      GEOWEBCACHE_CACHE_DIR: ${GEOWEBCACHE_CACHE_DIR:?}
      STABLE_EXTENSIONS: ${STABLE_EXTENSIONS:?}
      ENABLE_JSONP: ${ENABLE_JSONP:?}
      MAX_FILTER_RULES: ${MAX_FILTER_RULES:?}
      OPTIMIZE_LINE_WIDTH: ${OPTIMIZE_LINE_WIDTH:?}
      GEOSERVER_PROXY_BASE_URL: ${GEOSERVER_PROXY_BASE_URL:?}
      GEOSERVER_CSRF_WHITELIST: ${GEOSERVER_CSRF_WHITELIST:?}
      HTTP_SCHEME: ${HTTP_SCHEME:?}
      TOMCAT_SECURE: ${TOMCAT_SECURE:?}
      INITIAL_MEMORY: ${INITIAL_MEMORY:?}
      MAXIMUM_MEMORY: ${MAXIMUM_MEMORY:?}
      ADDITIONAL_JAVA_STARTUP_OPTIONS: ${ADDITIONAL_JAVA_STARTUP_OPTIONS?}
      GEOSERVER_XSTREAM_WHITELIST: ${GEOSERVER_XSTREAM_WHITELIST?}
      POSTGIS_HOST: ${POSTGIS_HOST:?}
      POSTGIS_PORT: ${POSTGIS_PORT:?}
      POSTGIS_DB: ${POSTGIS_DB:?}
      GS_CONTROLFLOW_TIMEOUT: ${GS_CONTROLFLOW_TIMEOUT:?}
      GS_CONTROLFLOW_OWS_GLOBAL: ${GS_CONTROLFLOW_OWS_GLOBAL:?}
      GS_CONTROLFLOW_OWS_WMS_GETMAP: ${GS_CONTROLFLOW_OWS_WMS_GETMAP:?}
      GS_CONTROLFLOW_OWS_WFS_MSEXCEL: ${GS_CONTROLFLOW_OWS_WFS_MSEXCEL:?}
      GS_CONTROLFLOW_OWS_GWC: ${GS_CONTROLFLOW_OWS_GWC:?}
      GS_CONTROLFLOW_USER: ${GS_CONTROLFLOW_USER:?}
      GS_CONTROLFLOW_USER_WPS_EXECUTE: ${GS_CONTROLFLOW_USER_WPS_EXECUTE:?}
      GS_CONTROLFLOW_USER_WMS_GETMAP: ${GS_CONTROLFLOW_USER_WMS_GETMAP:?}
      GS_CONTROLFLOW_IP: ${GS_CONTROLFLOW_IP:?}
    entrypoint: /opt/geoserver/scripts/entrypoint-wrapper.sh
    volumes:
      - ./geoserver_data:/opt/geoserver/data_dir
      - ${GWC_CACHE_HOST_DIR:?}:${GEOWEBCACHE_CACHE_DIR:?}
      - ./server.xml.template:/opt/geoserver/server.xml.template:ro
      - ./scripts/entrypoint-wrapper.sh:/opt/geoserver/scripts/entrypoint-wrapper.sh:ro
      - ./config/global.xml.template:/opt/geoserver/global.xml.template:ro
      - ./config/controlflow.properties.template:/opt/geoserver/controlflow.properties.template:ro
      - ./config/wms.xml:/opt/geoserver/config/wms.xml:ro
      - ./config/wfs.xml:/opt/geoserver/config/wfs.xml:ro
      - ./config/security/csp.xml:/opt/geoserver/config/csp.xml:ro
      - ./fonts:/opt/geoserver/fonts:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fsI http://localhost:8080/${GEOSERVER_CONTEXT_ROOT:?}/web/ >/dev/null || exit 1"]
      timeout: 10s
      start_period: 180s
    extra_hosts: *host-gateway
    networks:
      - sextante-net
      - iieg-network
    logging: *logging

  version-api:
    build: ./version-api
    container_name: sextante-version-api
    restart: unless-stopped
    ports:
      - "${VERSION_API_BIND_ADDR:?}:${VERSION_API_PORT:?}:8088"
    environment:
      ONTOY_SERVICE: sextante
      ONTOY_COMPOSE_PROJECT: sextante
      ONTOY_DISK_PATH: ${ONTOY_DISK_PATH:?}
    volumes:
      - ./VERSION:/app/VERSION:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/ontoy').read()"]
    networks:
      - iieg-network
    logging: *logging

networks:
  sextante-net:
    driver: bridge
  iieg-network:
    external: true
