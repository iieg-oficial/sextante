application:
  code: sextante
  name: Sextante
  description: GeoServer del IIEG. Iniciar sesion da acceso a la interfaz de administracion segun el rol
  homepage_url: ${SITIO}/sextante/web/
  redirect_uris:
    - ${SITIO}/sextante/web/login/oauth2/code/minerva__oidc

permissions:
  - key: sextante.geoserver.admin
    name: Administrar todo GeoServer (capas, estilos, stores, seguridad)
  - key: sextante.privadas.view
    name: Leer las capas privadas de mapalab

roles:
  - name: Administrador
    description: Acceso total a la interfaz de GeoServer. Se mapea a ROLE_ADMINISTRATOR
    permissions:
      - sextante.geoserver.admin

  - name: Lector de capas privadas
    description: Lee las capas marcadas como privadas (rol MAPALAB_PRIVADA de GeoServer). Para la cuenta de servicio de mapalab
    permissions:
      - sextante.privadas.view
